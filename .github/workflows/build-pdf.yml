name: Build LaTeX PDF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup TeX Live
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ctufit-thesis.tex
          latexmk_use_xelatex: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: ctufit-thesis.pdf
          retention-days: 30

      - name: Delete existing latest release (if exists)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          gh release delete latest --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (only on main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          gh release create latest \
            --title "Latest Thesis PDF" \
            --notes "Latest build of the thesis PDF from commit ${{ github.sha }}

          **Commit:** ${{ github.sha }}
          **Date:** ${{ github.event.head_commit.timestamp }}
          **Author:** ${{ github.event.head_commit.author.name }}" \
            ctufit-thesis.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
