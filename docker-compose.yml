version: "3.8"

services:
  latex:
    build: .
    image: latex-workshop:latest
    container_name: latex-workshop
    volumes:
      - .:/workspace
      - latex-cache:/root/.texmf
    working_dir: /workspace
    tty: true
    stdin_open: true
    environment:
      - TEXMFHOME=/root/.texmf
    command: /bin/bash
    # Ensure the container stays running for LaTeX Workshop
    restart: unless-stopped

volumes:
  latex-cache:
    driver: local
